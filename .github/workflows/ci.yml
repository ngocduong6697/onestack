name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    # Without a real database the integration tests skip, and a skipped test
    # that nobody notices is worse than no test at all.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: onestack
          POSTGRES_PASSWORD: onestack
          POSTGRES_DB: onestack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://onestack:onestack@localhost:5432/onestack_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --frozen-lockfile

      # These steps are `yarn verify` run one at a time, so a failure names
      # itself in the Actions UI instead of "exit code 1". Keep both in sync.

      # Cheap, and catches the mistake review reliably does not: a pasted key
      # looks like any other string to the person who pasted it.
      - run: yarn secrets:check

      - run: yarn format:check

      - run: yarn typecheck

      - run: yarn lint

      - run: yarn test:coverage

      # Advisory rather than blocking on a transitive advisory nobody can fix
      # today; it still surfaces in the log and in the job summary.
      - run: yarn audit --level high
        continue-on-error: true

      - run: yarn build
        env:
          # Build-time only; nothing connects during a Next build.
          NEXT_PUBLIC_API_URL: http://localhost:4000
